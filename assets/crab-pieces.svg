<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="A crab, three fifths of it drawn solid and the rest still in outline">
  <title>A crab, partly done</title>
  <!-- Original drawing for this project. One piece at a time: the plates
       on the left are finished, the ones on the right are still an outline. -->
  <defs>
    <clipPath id="shell"><ellipse cx="120" cy="100" rx="64" ry="40"/></clipPath>
    <clipPath id="todo"><rect x="135" y="50" width="60" height="100"/></clipPath>
  </defs>
  <!-- finished side: legs, arm, eye stalk -->
  <g fill="none" stroke="#E0672B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 108 34 114 22 134"/>
    <path d="M67 122 44 134 36 156"/>
    <path d="M82 132 64 150 62 170"/>
    <path d="M62 85 44 70"/>
    <path d="M104 62 99 40"/>
  </g>
  <!-- side still to do -->
  <g fill="none" stroke="#8B93A1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7">
    <path d="M182 108 206 114 218 134"/>
    <path d="M173 122 196 134 204 156"/>
    <path d="M158 132 176 150 178 170"/>
    <path d="M178 85 196 70"/>
    <path d="M136 62 141 40"/>
    <ellipse cx="120" cy="100" rx="62" ry="38" clip-path="url(#todo)"/>
    <path d="M160 68V132"/>
    <circle cx="143" cy="33" r="7"/>
    <path d="M208 56 194 43A18 18 0 1 1 190 62Z"/>
  </g>
  <!-- the finished plates of the shell -->
  <g clip-path="url(#shell)" fill="#E0672B">
    <rect x="50" y="56" width="31" height="90"/>
    <rect x="85" y="56" width="23" height="90"/>
    <rect x="112" y="56" width="23" height="90"/>
  </g>
  <path d="M32 56 46 43A18 18 0 1 0 50 62Z" fill="#E0672B"/>
  <circle cx="97" cy="33" r="8" fill="#E0672B"/>
</svg>

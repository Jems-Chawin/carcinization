    <path d="M10 18C190 18 300 86 452 86"/>
    <path d="M10 52C170 52 300 86 452 86"/>
    <path d="M10 86H452"/>
    <path d="M10 120C170 120 300 86 452 86"/>
    <path d="M10 154C190 154 300 86 452 86"/>
  </g>
  <!-- travellers, each some way along -->
  <g fill="#8B93A1">

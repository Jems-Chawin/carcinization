    <circle cx="214" cy="60" r="6"/>
    <circle cx="150" cy="86" r="6"/>
    <circle cx="300" cy="100" r="6"/>
    <circle cx="60" cy="153" r="6"/>
  </g>
  <circle cx="404" cy="86" r="6" fill="#E0672B"/>

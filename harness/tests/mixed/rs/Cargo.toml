# Test fixture for carcinify diff: a maturin "mixed" project, a compiled core
# (port_rs._native) under a thin Python layer (port_rs/__init__.py).
# tests/mixed.rs copies it into a temporary repository and builds it there.
[package]
name = "port_rs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = "0.30.1"


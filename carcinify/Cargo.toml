[package]
name = "carcinify"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license.workspace = true
description = "Tools that measure each step of moving Python code to Rust behind PyO3: decide, deps, diff, structure"
autotests = false

# The one binary. Each subcommand is a library crate beside this one; this
# crate only chooses among them.
[dependencies]
carcinify-decide = { path = "../decide" }
carcinify-deps = { path = "../deps" }
carcinify-diff = { path = "../harness" }
carcinify-structure = { path = "../structure" }

[dev-dependencies]
# The tests below read reports and build fixtures.
serde_json = "1.0.154"

# The tests that run the binary live with the tool they test, and are built
# here because only this crate has the binary.
[[test]]
name = "diff"
path = "../harness/tests/cli.rs"

[[test]]
name = "diff-example"
path = "../harness/tests/example.rs"

[[test]]
name = "diff-mixed"
path = "../harness/tests/mixed.rs"

[[test]]
name = "structure"
path = "../structure/tests/cli.rs"

[[test]]
name = "deps"
path = "../deps/tests/cli.rs"

[[test]]
name = "decide"
path = "../decide/tests/cli.rs"

# This crate's own tests: the dispatcher, and that every test file of a tool
# is listed above.
[[test]]
name = "command"
path = "tests/command.rs"

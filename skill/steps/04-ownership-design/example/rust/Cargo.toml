# The worked example of the ownership design step: one Python original
# (../python/fleet.py), two Rust ports of it in `core`, and one small PyO3
# crate for each port so that carcinify diff can compare both with the original.
[workspace]
members = ["core", "py-appeasement", "py-designed"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

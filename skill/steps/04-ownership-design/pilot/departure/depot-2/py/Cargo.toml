# Copied beside each finished run by measure.py: the run's `depot` crate as
# a Python module, so that carcinify diff can compare it with depot.py.
[package]
name = "depot_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
depot = { path = "../../../runs/depot-2/depot" }
pyo3 = "0.30.1"

[workspace]
